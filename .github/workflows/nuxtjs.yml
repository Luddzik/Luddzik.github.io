name: Deploy Next.js app to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          cd pretty-awesome-games
          if [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_ENV
          elif [ -f "package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_ENV
          else
            echo "manager=npm" >> $GITHUB_ENV
          fi
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          # Tell setup-node where the lock file is (if using npm):
          cache-dependency-path: "pretty-awesome-games/package-lock.json"

      - name: Install dependencies (ignoring peer deps)
        run: |
          cd pretty-awesome-games
          npm install --legacy-peer-deps
          
      - name: Build Next.js
        run: |
          cd pretty-awesome-games
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pretty-awesome-games/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
