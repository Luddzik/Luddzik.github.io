name: Deploy Next.js app to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Print Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: |
          cd red-bear-studios
          npm ci --legacy-peer-deps
        
      - name: Build Next.js
        run: |
          cd red-bear-studios
          npm run build
        
      - name: Check for out directory
        run: |
          cd red-bear-studios
          if [ -d "out" ]; then
            echo "out directory exists"
            ls -la out
          else
            echo "out directory does not exist"
            echo "Current directory contents:"
            ls -la
            echo "Build output:"
            cat .next/build-manifest.json
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: red-bear-studios/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

