name: Deploy Next.js app to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Print Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: |
          cd red-bear-studios
          npm ci --legacy-peer-deps
        
      - name: Build Next.js
        run: |
          cd red-bear-studios
          npm run build
        
      - name: Debug build output
        run: |
          cd red-bear-studios
          echo "Current directory contents:"
          ls -la
          echo "Next.js build output:"
          ls -la .next || echo ".next directory not found"
          echo "Out directory contents:"
          ls -la out || echo "out directory not found"
          echo "Package.json contents:"
          cat package.json
          echo "Next.config.js contents:"
          cat next.config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: red-bear-studios/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

